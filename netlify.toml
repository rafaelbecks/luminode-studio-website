[build]
  command = "git lfs pull && git submodule update --init --recursive && npm run build"
  publish = "dist"

[build.environment]
  GIT_LFS_ENABLED = "true"

[[redirects]]
  from = "/software"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/software/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/music"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/music/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/diskette.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
